<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜前川尚志 公式サイト</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0b0a0b; --paper: #f2ecea; --red: #e63946; --mute: #8d8385; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-family: 'Noto Sans JP', sans-serif; text-align: center; padding: 24px; }
  h1 { font-family: 'Bebas Neue', 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(6rem, 30vw, 14rem); line-height: .85; margin: 0; }
  h1 span { color: var(--red); }
  p { color: var(--mute); margin: 18px 0 32px; }
  a { display: inline-block; background: var(--red); color: var(--ink); padding: 14px 28px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <main>
    <h1>4<span>0</span>4</h1>
    <p>お探しのページは見つかりませんでした。</p>
    <a href="/">前川尚志 公式サイトへ戻る</a>
  </main>
</body>
</html>
